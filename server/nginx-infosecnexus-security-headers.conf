# Include inside the HTTPS server{} block for infosecnexus.com.
# These headers use "always" so proxy, Nginx-generated 403/404, and error
# responses receive the same protection.
#
# IMPORTANT: Nginx only inherits these values into a child location when that
# location does not define any add_header directives of its own. If a location
# adds even one header, repeat this complete set there or use the strict static
# header set from nginx-infosecnexus-production.conf.
#
# The frontend still emits inline WordPress configuration and Google AdSense.
# Removing unsafe-inline/unsafe-eval from this compatibility policy without an
# application-level nonce migration will break those features. Static files and
# their 404 responses can use a stricter policy because they do not render the
# WordPress document.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'self' https:; form-action 'self'; upgrade-insecure-requests" always;
