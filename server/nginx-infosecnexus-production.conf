# InfoSecNexus production Nginx server template.
#
# This is based on the hosting-provider template supplied on 2026-08-05.
# Keep the {{...}} placeholders intact when pasting it back into that provider.
# Test with `sudo nginx -t` before reloading Nginx.
#
# What this fixes:
# - CSP and all security headers are returned on fake/missing static paths such
#   as /404javascript.js.
# - Child-location add_header inheritance is handled explicitly.
# - Hidden files, repository metadata, sensitive project files, and PHP files
#   inside uploads are blocked.
# - Forwarded request metadata is consistent for WordPress and Varnish.
#
# What this cannot fix:
# - A scanner's "no cloud WAF detected" warning. A WAF must be enabled at the
#   DNS/CDN/reverse-proxy layer (for example Cloudflare or Sucuri Firewall).
# - The dynamic-page unsafe-inline compatibility notice without a coordinated
#   application nonce/hash migration. WordPress currently renders inline
#   configuration and Google AdSense officially requires strict-CSP integration.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.infosecnexus.com;

  # Redirect responses contain a deliberately closed policy.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'none'; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'" always;

  return 301 https://infosecnexus.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name infosecnexus.com www1.infosecnexus.com;
  {{root}}
  {{nginx_access_log}}
  {{nginx_error_log}}

  server_tokens off;

  # Compatibility CSP for rendered WordPress pages. Keep this aligned with
  # wp-content/themes/infosecnexus/inc/security-headers.php.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'self' https:; form-action 'self'; upgrade-insecure-requests" always;

  if ($scheme != "https") {
    return 301 https://infosecnexus.com$request_uri;
  }

  location ^~ /.well-known/ {
    auth_basic off;
    allow all;
  }

  {{settings}}

  # Block dotfiles and repository metadata except /.well-known/ above.
  location ~ /\.(?!well-known(?:/|$)) {
    deny all;
  }

  location = /xmlrpc.php {
    deny all;
  }

  # These files have no reason to be web-readable on production.
  location ~* ^/(?:wp-config\.php|composer\.(?:json|lock)|package(?:-lock)?\.json|phpcs\.xml(?:\.dist)?|phpstan\.neon|\.env(?:\..*)?)$ {
    deny all;
  }

  # Uploaded content must never execute as PHP.
  location ~* ^/wp-content/uploads/.*\.php(?:$|/) {
    return 404;
  }

  # Uncomment only if basic authentication is intentionally enabled and
  # frontend AJAX needs to bypass it.
  # location = /wp-admin/admin-ajax.php {
  #   auth_basic off;
  # }

  location ~ ^/(?:wp-admin(?:/|$)|wp-login\.php$) {
    # auth_basic "Restricted Area";
    # auth_basic_user_file /home/site-user/.htpasswd;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8080;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 7200;
    proxy_send_timeout 7200;
    proxy_read_timeout 7200;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }

  location / {
    {{varnish_proxy_pass}}
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_hide_header X-Varnish;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 720;
    proxy_send_timeout 720;
    proxy_read_timeout 720;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }

  location ~* ^.+\.(?:css|js|jpg|jpeg|gif|png|avif|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map|json|xml|pdf)$ {
    # WordPress Multisite Subdirectory rewrites.
    rewrite ^/[_0-9a-zA-Z-]+(/wp-.*) $1 break;
    rewrite ^/[_0-9a-zA-Z-]+(/.*\.php)$ $1 break;

    # This location has its own add_header directives, so the complete header
    # set is repeated. Its strict CSP also covers Nginx-generated static 404s.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'none'; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'" always;

    expires max;
    access_log off;
    log_not_found off;
    try_files $uri =404;
  }

  if (-f $request_filename) {
    break;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name infosecnexus.com www1.infosecnexus.com;
  {{root}}
  include /etc/nginx/global_settings;
  server_tokens off;
  try_files $uri $uri/ /index.php?$args;
  index index.php index.html;

  # Keep port 8080 private/firewalled. These rules also protect the backend if
  # it is accidentally reachable directly.
  location ~ /\.(?!well-known(?:/|$)) {
    deny all;
  }

  location = /xmlrpc.php {
    deny all;
  }

  location ~* ^/wp-content/uploads/.*\.php(?:$|/) {
    return 404;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  # WordPress Multisite Subdirectory.
  if (!-e $request_filename) {
    rewrite /wp-admin$ https://$host$uri permanent;
    rewrite ^/[_0-9a-zA-Z-]+(/wp-.*) $1 last;
    rewrite ^/[_0-9a-zA-Z-]+(/.*\.php)$ $1 last;
  }

  if (-f $request_filename) {
    break;
  }
}
